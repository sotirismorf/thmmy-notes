<!DOCTYPE html>
<html lang="{{ .Site.Language.Locale }}">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>{{ block "title" . }}{{ if not .IsHome }}{{ .Title }} — {{ end }}{{ .Site.Title }}{{ end }}</title>
  <link rel="stylesheet" href="{{ "css/styles.css" | absURL }}">
  <link rel="stylesheet" href="{{ "css/print.css" | absURL }}" media="print">

  <script>
    MathJax = {
      tex: {
        displayMath: [['\\[', '\\]'], ['$$', '$$']],
        inlineMath: [['\\(', '\\)'], ['$', '$']],
      }
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
  {{ if .Store.Get "hasMermaid" }}
  <script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
    const dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    mermaid.initialize({ startOnLoad: true, theme: dark ? 'dark' : 'default' });
  </script>
  {{ end }}
</head>

<body>
  {{ block "main" . }}{{ end }}
  <script>
    // Wrap each "Εκφώνηση" heading + its following content (until the next
    // heading or <hr>) in a .exercise-statement box, for visual framing.
    (function () {
      document.querySelectorAll('h4').forEach(function (h) {
        if (h.textContent.trim() !== 'Εκφώνηση') return;
        var box = document.createElement('div');
        box.className = 'exercise-statement';
        h.parentNode.insertBefore(box, h);
        var cur = h;
        while (cur) {
          var next = cur.nextSibling;
          box.appendChild(cur);
          if (!next) break;
          if (next.nodeType === 1 && /^(H1|H2|H3|H4|HR)$/.test(next.tagName)) break;
          cur = next;
        }
      });
    })();
    // Group each Θέμα/exercise heading + its tags + the statement box into one
    // "keep-together" wrapper, so on print they move to the next page as a unit
    // (page-break-inside:avoid on the group is far more reliable than chaining
    // page-break-after:avoid across the separate elements).
    (function () {
      document.querySelectorAll('.exercise-statement').forEach(function (box) {
        var first = box;
        var prev = box.previousElementSibling;
        if (prev && prev.classList && prev.classList.contains('exercise-tags')) {
          first = prev;
          prev = prev.previousElementSibling;
        }
        if (prev && /^H[2-4]$/.test(prev.tagName)) {
          first = prev;
        }
        if (first === box) return;            // nothing to group
        var group = document.createElement('div');
        group.className = 'exercise-keep';
        box.parentNode.insertBefore(group, first);
        var node = first;
        while (node) {
          var next = node.nextSibling;
          group.appendChild(node);
          if (node === box) break;
          node = next;
        }
      });
    })();
  </script>
  <script>
    (function () {
      const toc = document.getElementById('TableOfContents');
      if (!toc) return;
      const links = toc.querySelectorAll('a');
      const headings = document.querySelectorAll('h2, h3');
      if (!headings.length) return;
      const obs = new IntersectionObserver(entries => {
        entries.forEach(e => {
          if (e.isIntersecting) {
            links.forEach(l => l.classList.remove('active'));
            const a = toc.querySelector('a[href="#' + e.target.id + '"]');
            if (a) a.classList.add('active');
          }
        });
      }, { rootMargin: '-10% 0px -80% 0px' });
      headings.forEach(h => obs.observe(h));
    })();
  </script>
</body>

</html>
